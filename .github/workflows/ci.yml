name: CI

on:
  pull_request:
    branches: ['*']

# Drop all permissions by default — each job grants only what it needs
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Windows — MSBuild (Debug + Release matrix)
  # ---------------------------------------------------------------------------
  build:
    runs-on: windows-latest
    permissions:
      contents: read          # Required to checkout the repository
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build solution (${{ matrix.configuration }})
        run: msbuild src\rssavers.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x86
