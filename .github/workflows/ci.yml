name: CI

on:
  pull_request:
    branches: ['*']

# One run per pull request. Pushing again supersedes whatever is still running:
# the older commit's result is no longer the answer to any question, and these
# runs are expensive — the coverage job alone is ~6 minutes of instrumented
# execution on top of two full solution builds.
#
# Grouped by ref rather than by SHA, so consecutive pushes to the same branch
# cancel each other while unrelated pull requests run in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Drop all permissions by default — each job grants only what it needs
permissions: {}

# Every configuration is compiled, and every configuration's tests are executed,
# but each exactly once:
#
#   build (Debug)    solution only        - Debug tests are the coverage job's
#   build (Release)  solution + tests     - the configuration that ships
#   coverage         tests, instrumented  - Debug, and the only Debug test run
#
# Running the suite plain in Debug as well would execute identical code twice,
# because the coverage job is the same run with instrumentation attached. Both
# configurations still matter on their own: Release exposes optimiser-dependent
# behaviour and is what users get, Debug keeps the CRT heap and iterator checks
# live.
#
# Kept to two jobs rather than three because each one re-checks-out with
# submodules and LFS, which costs more than the run being saved.

jobs:
  # ---------------------------------------------------------------------------
  # Windows — MSBuild (Debug + Release matrix)
  # ---------------------------------------------------------------------------
  build:
    runs-on: windows-latest
    permissions:
      contents: read          # Required to checkout the repository
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build solution (${{ matrix.configuration }})
        run: msbuild src\rssavers.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x86

      # Release only: the Debug tests are built and run by the coverage job, and
      # doing them here as well would be the same execution twice.
      - name: Configure tests (CMake)
        if: matrix.configuration == 'Release'
        run: cmake -S tests -B tests/build -A Win32

      - name: Build tests
        if: matrix.configuration == 'Release'
        run: cmake --build tests/build --config Release

      # No `if: always()`. A failed build should report one red step, not also
      # a test failure that is only a consequence of it.
      - name: Run tests
        if: matrix.configuration == 'Release'
        run: ctest --test-dir tests/build -C Release --output-on-failure

  # ---------------------------------------------------------------------------
  # Coverage — OpenCppCoverage over the saver tests, reported on the PR.
  #
  # This is also the Debug test run: the suite is not executed plain in Debug
  # anywhere else, so a Debug-only failure surfaces here. OpenCppCoverage passes
  # the child's exit code through, so a failing test still fails the job.
  # ---------------------------------------------------------------------------
  coverage:
    runs-on: windows-latest
    permissions:
      contents: read          # Required to checkout the repository
      pull-requests: write    # Required to post the coverage comment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          lfs: true

      - name: Install OpenCppCoverage
        run: choco install opencppcoverage --no-progress --yes

      - name: Configure tests (CMake)
        run: cmake -S tests -B tests/build -A Win32

      # Debug only: Release inlining makes line attribution meaningless, and
      # OpenCppCoverage needs the PDBs this configuration produces.
      - name: Build tests (Debug)
        run: cmake --build tests/build --config Debug

      # --sources must be an absolute path. The MSVC CRT's own sources live
      # under paths containing \src\ (vctools\crt\vcruntime\src\...), so a bare
      # "src" filter pulls the entire runtime into the denominator and reports
      # roughly an eighth of the real figure.
      #
      # --cover_children is required because ctest runs each test as a child
      # process; without it the report comes back empty.
      #
      # Deliberately NO --modules. It looks like the obvious tuning knob - the
      # default is "*", so every loaded module including the whole Windows DLL
      # set is selected - but restricting it to the test binaries made the run
      # dramatically SLOWER when measured: the fieldlines suite went from 53
      # seconds to 2,013. Whatever OpenCppCoverage does with modules outside the
      # filter, it is not cheaper than instrumenting them. See docs/MAINTENANCE.md.
      #
      # -j is what makes this job affordable. The tests are ~300 independent
      # processes and instrumentation is the whole cost, so they parallelise
      # almost linearly: 13 minutes serial against 5.4 at -j 8 locally, for a
      # coverage total identical to four significant figures. OpenCppCoverage
      # merges concurrent children correctly - that was measured, not assumed.
      #
      # Sized from the runner rather than hardcoded, since hosted runners have
      # far fewer cores than a development machine.
      #
      # No --timeout on this ctest: under instrumentation the heavier suites
      # exceed a short per-test limit.
      - name: Run tests under coverage
        shell: pwsh
        run: |
          $occ = "$env:ProgramFiles\OpenCppCoverage\OpenCppCoverage.exe"
          $jobs = [Environment]::ProcessorCount
          Write-Host "Running the suite with -j $jobs"
          & $occ `
            --sources "$env:GITHUB_WORKSPACE\src" `
            --excluded_sources "$env:GITHUB_WORKSPACE\tests" `
            --cover_children `
            --export_type "cobertura:$env:GITHUB_WORKSPACE\coverage.xml" `
            -- ctest --test-dir tests/build -C Debug -j $jobs --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "tests failed under coverage" }

      - name: Report coverage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: pwsh tests/tools/coverage-report.ps1 -ReportPath coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cobertura
          path: coverage.xml
